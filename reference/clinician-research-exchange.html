<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinician Research Exchange</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="app-css">
:root{
  /* Layout: a case-sheet tool. Header with tabs, then a two-column work area (form or controls left, ranked records right). */
  --paper:#F4F6F5; --panel:#FFFFFF; --ink:#16211E; --muted:#5D6B67; --line:#D9E0DD;
  --accent:#0E6B5C; --accent-soft:#E2F1ED; --signal:#A86F06; --signal-soft:#FBF0DA; --warn:#B3261E; --warn-soft:#FBE9E7;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1513; --panel:#162019; --ink:#E3ECE8; --muted:#93A39E; --line:#2A3733;
    --accent:#4FC1A6; --accent-soft:#17332C; --signal:#E5B04A; --signal-soft:#3A2D12; --warn:#F2948C; --warn-soft:#3B1C1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1513; --panel:#162019; --ink:#E3ECE8; --muted:#93A39E; --line:#2A3733;
  --accent:#4FC1A6; --accent-soft:#17332C; --signal:#E5B04A; --signal-soft:#3A2D12; --warn:#F2948C; --warn-soft:#3B1C1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px}
.brand h1{font:600 24px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:4px 0 12px;color:var(--muted);font-size:13.5px;max-width:62ch}
nav.tabs{display:flex;gap:4px}
nav.tabs a{display:block;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{font-size:13px;color:var(--muted);padding:8px 0}
.notice b{color:var(--ink);font-weight:500}
main{padding:20px 0 48px}
.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font:600 17px/1.2 var(--display);margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=url],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}
button{font:inherit;font-size:14px;font-weight:500;cursor:pointer;border-radius:6px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--panel)}
button.ghost{background:transparent;color:var(--accent)}
button.small{padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.card.hit{border-left:4px solid var(--accent);border-radius:0 10px 10px 0}
.card h3{font:600 16px/1.3 var(--display);margin:0;text-wrap:balance}
.meta{font-size:12.5px;color:var(--muted)}
.body{grid-column:1/-1;font-size:14px}
.body p{margin:0 0 6px;max-width:72ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.chip.ta{background:transparent;border-color:var(--line);color:var(--muted)}
.chip.sig{background:var(--signal-soft);color:var(--signal)}
.chip.sample{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.score{font:500 26px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--accent)}
.score small{display:block;font:400 11px/1.3 var(--body);color:var(--muted);margin-top:4px}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bars{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:4px}
.bar{font-size:12px;color:var(--muted)}
.bar .t{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar .tr{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:2px}
.bar .fl{height:100%;background:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.toolbar label.f{min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sel-summary{background:var(--signal-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.sel-summary b{font-weight:600}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
summary{cursor:pointer;font-weight:500;font-size:14px}
pre.tpl{font:12px/1.5 var(--mono);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto;white-space:pre}
.empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.split{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.mini{display:flex;flex-direction:column;gap:10px}
.mini .m{border-bottom:1px solid var(--line);padding-bottom:8px;font-size:13.5px}
.mini .m:last-child{border-bottom:0}
.mini .m b{font-weight:600}
.legend{font-size:12.5px;color:var(--muted);margin-top:10px}
.lb{font-weight:500}
.ok{color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:13px}
h3.sec{font:600 14px/1.2 var(--display);margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line);text-transform:none}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
fieldset.checks{border:0;padding:0;margin:0}
fieldset.checks legend{padding:0;margin-bottom:6px}
.checks.tight{gap:4px 12px}
.grid.wide{grid-template-columns:minmax(300px,430px) 1fr}
@media (max-width:820px){.grid.wide{grid-template-columns:1fr}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
select.inline{width:auto;max-width:260px;padding:4px 8px;font-size:13px}
nav.tabs{flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

function uniq(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function norm(t){return " "+String(t||"").toLowerCase().replace(/[^a-z0-9\-]+/g," ")+" "}
function hasTerm(n,t){t=t.toLowerCase();return n.indexOf(" "+t+" ")>=0||n.indexOf(" "+t+"s ")>=0||n.indexOf(" "+t+"es ")>=0}
function concepts(text){var n=norm(text),out=[];CONCEPTS.forEach(function(c){for(var i=0;i<c.terms.length;i++){if(hasTerm(n,c.terms[i])){out.push(c.id);break}}});return out}
function qText(q){return [q.question,q.population,(q.tags||[]).join(" "),q.specialty].join(" ")}
function iText(i){var a=i.annot||{};return [i.title,i.summary,a.claim,a.population].join(" ")}
function iConcepts(i){return uniq(concepts(iText(i)).concat(i.tagIds||[]))}
function tokens(t){return norm(t).trim().split(/\s+/).filter(function(w){return w.length>2&&STOP.indexOf(w)<0})}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nameKey(s){return String(s||"").toLowerCase().replace(/^dr\.?\s+/,"").replace(/[^a-z]/g,"")}
function docById(id){return state.doctors.filter(function(d){return d.id===id})[0]}
function docByName(n){var k=nameKey(n);return k?state.doctors.filter(function(d){return nameKey(d.name)===k})[0]:null}

function idfTable(){var docs=state.questions.map(qText).concat(state.inventions.map(iText)),df={},N=docs.length;docs.forEach(function(d){var seen={};tokens(d).forEach(function(w){if(!seen[w]){seen[w]=1;df[w]=(df[w]||0)+1}})});var idf={};for(var w in df)idf[w]=Math.log((N+1)/(df[w]+0.5));return idf}
function vec(t,idf){var v={};tokens(t).forEach(function(w){v[w]=(v[w]||0)+(idf[w]||Math.log(2))});return v}
function cosine(a,b){var d=0,na=0,nb=0,k;for(k in a){na+=a[k]*a[k];if(b[k])d+=a[k]*b[k]}for(k in b)nb+=b[k]*b[k];return na&&nb?d/Math.sqrt(na*nb):0}

/* Research bridge + match score between a question and a paper or invention */
function matchPair(q,inv,idf){
  var qc=concepts(qText(q)),ic=iConcepts(inv);
  var shared=qc.filter(function(c){return ic.indexOf(c)>=0});
  var qta={},ita={};qc.forEach(function(c){qta[CMAP[c].ta]=1});ic.forEach(function(c){ita[CMAP[c].ta]=1});
  var taOnly=Object.keys(qta).filter(function(t){return ita[t]&&!shared.some(function(c){return CMAP[c].ta===t})});
  var conceptFit=qc.length?Math.min(1,(shared.length+0.4*taOnly.length)/Math.min(qc.length,3)):0;
  var textFit=Math.min(1,cosine(vec(qText(q),idf),vec(iText(inv),idf))*2.2);
  var settingFit=(inv.settings||[]).indexOf(q.setting)>=0?1:0.3;
  var ready=STAGES[inv.stage]||0.5;
  var endorse=Math.min((inv.endorsements||[]).length,2)/2;
  var total=Math.round(100*(0.45*conceptFit+0.25*textFit+0.15*settingFit+0.10*ready+0.05*endorse));
  return {score:total,shared:shared,taOnly:taOnly,settingFit:settingFit===1,parts:{concept:conceptFit,text:textFit,setting:settingFit,ready:ready,endorse:endorse}};
}

/* Champion score: how likely a doctor is to champion and run a pilot */
function nomsFor(d){return state.nominations.filter(function(n){return n.doctorId===d.id})}
function champ(d){
  var hasClinic=!!(d.clinic&&d.clinic.trim()),hasHosp=(d.hospitals||[]).length>0;
  var dual=hasClinic&&hasHosp?20:hasClinic?8:hasHosp?4:0;
  var research=Math.min(+d.pubs||0,8)/8*10;
  var trials=Math.min(+d.trials||0,3)/3*15;
  var posts=state.questions.filter(function(q){return nameKey(q.author)===nameKey(d.name)}).length;
  var endorsed=state.inventions.filter(function(i){return (i.endorsements||[]).indexOf(d.id)>=0}).length;
  var submitted=state.inventions.filter(function(i){return i.role==="Doctor"&&nameKey(i.submitter)===nameKey(d.name)}).length;
  var board=Math.min(posts*8+endorsed*5+submitted*8,15);
  var noms=nomsFor(d),open=noms.filter(function(n){return (n.reasons||[]).indexOf("Open to new treatments or tools")>=0}).length;
  var trust=Math.min(noms.length*4+open*2,15);
  var curiosity=(d.interests&&d.interests.trim()?5:0)+(d.teaching?5:0);
  var reach=Math.min(1,Math.log10(1+(+d.reviews||0))/Math.log10(501))*5;
  var y=+d.years||0,exp=!y?0:(y>=8&&y<=25)?10:((y>=5&&y<8)||(y>25&&y<=32))?6:3;
  var parts=[["Clinic + hospital",dual,20],["Trial experience",trials,15],["Activity on exchange",board,15],["Patient trust",trust,15],["Publications",research,10],["Interests & teaching",curiosity,10],["Career stage",exp,10],["Patient reach",reach,5]];
  var total=Math.round(parts.reduce(function(s,p){return s+p[1]},0));
  return {total:total,parts:parts,dual:hasClinic&&hasHosp,posts:posts,endorsed:endorsed,submitted:submitted,noms:noms};
}
function relevantChampions(cids,limit,inv){
  var sp={};cids.forEach(function(c){CMAP[c].sp.forEach(function(s){sp[s]=1})});
  return state.doctors.map(function(d){
    var ic=concepts(d.interests||""),hit=ic.filter(function(c){return cids.indexOf(c)>=0});
    var end=inv&&(inv.endorsements||[]).indexOf(d.id)>=0;
    if(!sp[d.specialty]&&!hit.length&&!end)return null;
    var c=champ(d);return {d:d,c:c,hit:hit,end:end,score:Math.round(c.total*0.75+(hit.length?15:0)+(end?10:0))};
  }).filter(Boolean).sort(function(a,b){return (b.end-a.end)||(b.c.dual-a.c.dual)||(b.score-a.score)}).slice(0,limit||3);
}

/* Patient-identifier check */
function phiProblems(t){var p=[];
  if(/\b\d{10}\b/.test(t))p.push("a 10-digit number (phone?)");
  if(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/.test(t))p.push("a specific date");
  if(/\b(uhid|mrn|ip\s?no|op\s?no|reg\.?\s?no|aadhaar)\b/i.test(t))p.push("a record or ID number");
  if(/\b(mr|mrs|ms|master|baby of)\.?\s+[A-Z][a-z]+/.test(t))p.push("a patient name");
  if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(t))p.push("an email address");
  return p}

/* Sharing: rebuild the page from its pristine sources plus state, then publish */
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Clinician Research Exchange</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style id=\"app-css\">"+SRC_CSS+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"app-state\">"+json+"<\/script>\n<script id=\"app-js\">"+SRC_JS+"<\/script>\n</body>\n</html>";
}
function save(){
  render();
  if(!art||readOnly)return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(function(){
    art.publish(buildDoc()).catch(function(e){var m=String(e&&(e.code||e.message)||e);if(/not_granted|not_writer/.test(m)){readOnly=true;render()}});
  },800);
}
try{if(window.claude&&typeof window.claude.use==="function"){window.claude.use("artifact").then(function(ns){art=ns;shared=ns?"on":"off";render()}).catch(function(){shared="off";render()})}else{shared="off"}}catch(e){shared="off"}

/* ---------- Shared bits ---------- */
function chipsFor(cids){
  if(!cids.length)return '<span class="chip ta">No conditions detected yet</span>';
  var tas={};cids.forEach(function(c){tas[CMAP[c].ta]=1});
  return cids.map(function(c){return '<span class="chip">'+esc(CMAP[c].label)+'</span>'}).join("")+Object.keys(tas).map(function(t){return '<span class="chip ta">'+esc(t)+'</span>'}).join("");
}
function opts(list,sel){return list.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'}).join("")}
function dis(){return readOnly?' disabled':''}
function specList(){return uniq(state.doctors.map(function(d){return d.specialty}).concat(["Community Medicine","Endocrinology","Neonatology"])).sort()}
function docOpts(sel){return state.doctors.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(d){return '<option value="'+d.id+'"'+(d.id===sel?' selected':'')+'>'+esc(d.name)+' · '+esc(d.specialty)+(d.city?', '+esc(d.city):'')+'</option>'}).join("")}

  return '<div class="grid">'+side+list+'</div>';
}
function topReasons(noms){var c={};noms.forEach(function(n){(n.reasons||[]).forEach(function(r){c[r]=(c[r]||0)+1})});var k=Object.keys(c).sort(function(a,b){return c[b]-c[a]});return k.slice(0,3).map(function(r){return r.toLowerCase()+(c[r]>1?' ('+c[r]+')':'')}).join(", ")}

/* ---------- Patient nominations ---------- */
function viewNominate(){
  var form='<form class="panel stack" id="n-form" novalidate>'+
   '<div><h2>Nominate a doctor you trust</h2><p class="sub">Researchers are looking for doctors to try new treatments, tools and ways of caring for patients. Tell us which doctor you would trust to do this well.</p></div>'+
   '<label class="f" for="n-doc">Your doctor<select id="n-doc"><option value="">Choose a doctor</option>'+docOpts("")+'<option value="__new">My doctor is not on this list</option></select></label>'+
   '<div id="n-newdoc" class="stack" style="display:none"><label class="f" for="n-name">Doctor\'s name<input type="text" id="n-name" placeholder="Dr. …"></label>'+
   '<div class="row2"><label class="f" for="n-spec">What they treat<select id="n-spec"><option value="">Not sure</option>'+opts(specList(),"")+'</select></label><label class="f" for="n-city">City<input type="text" id="n-city"></label></div>'+
   '<label class="f" for="n-clinic">Clinic or hospital where you see them<input type="text" id="n-clinic"></label></div>'+
   '<fieldset class="checks tight"><legend class="meta">Why do you trust them? Pick any</legend>'+TRUST.map(function(s,ix){return '<label for="n-r-'+ix+'"><input type="checkbox" id="n-r-'+ix+'" value="'+esc(s)+'"> '+esc(s)+'</label>'}).join("")+'</fieldset>'+
   '<div class="row2"><label class="f" for="n-since">How long have you seen them?<select id="n-since">'+opts(["Under 1 year","1–3 years","3+ years"],"1–3 years")+'</select></label>'+
   '<label class="f" for="n-by">I am a<select id="n-by">'+opts(["Patient","Family caregiver"],"Patient")+'</select></label></div>'+
   '<label class="f" for="n-area">Area of care<span class="h">Optional. A broad area only, never your diagnosis.</span><select id="n-area"><option value="">Prefer not to say</option>'+opts(TAS,"")+'</select></label>'+
   '<label class="f" for="n-note">Anything else? <span class="h">Optional, up to 300 characters. Please leave out your name, phone number and health details.</span><textarea id="n-note" maxlength="300" style="min-height:60px"></textarea></label>'+
   '<label class="checks" for="n-consent"><input type="checkbox" id="n-consent"> I understand doctors and researchers on this exchange can see this nomination. It does not include my name.</label>'+
   (ui.nErr?'<div class="err" role="alert">'+esc(ui.nErr)+'</div>':'')+(ui.nMsg?'<div class="ok" role="status">'+esc(ui.nMsg)+'</div>':'')+
   '<button type="submit"'+dis()+'>Send nomination</button></form>';
  var counts={};state.nominations.forEach(function(n){counts[n.doctorId]=(counts[n.doctorId]||0)+1});
  var top=Object.keys(counts).map(function(id){return {d:docById(id),n:counts[id]}}).filter(function(x){return x.d}).sort(function(a,b){return b.n-a.n}).slice(0,8);
  var side='<div class="stack"><div class="panel"><h2>How nominations are used</h2><div class="mini"><div class="m">Each nomination adds to the doctor\'s patient-trust score, which helps researchers decide who to approach first.</div><div class="m">"Open to new treatments or tools" carries extra weight, because a pilot needs a doctor willing to try something new.</div><div class="m">Nominations are anonymous. Only the reasons, how long you have seen them and the broad area of care are shown.</div><div class="m">A doctor you add who is not on the list appears as "not verified" until their practice details are checked.</div></div></div>'+
   '<div class="panel"><h2>Most nominated</h2>'+(top.length?'<div class="mini">'+top.map(function(x){return '<div class="m"><b>'+esc(x.d.name)+'</b> · '+x.n+'<br><span class="meta">'+esc(x.d.specialty||"")+(x.d.city?', '+esc(x.d.city):'')+(topReasons(nomsFor(x.d))?' · '+esc(topReasons(nomsFor(x.d))):'')+'</span></div>'}).join("")+'</div>':'<p class="sub">No nominations yet.</p>')+'</div></div>';
  return '<div class="grid wide">'+form+side+'</div>';
}

/* ---------- Match ---------- */
function reasonChips(m,inv){
  var c=m.shared.map(function(id){return '<span class="chip">'+esc(CMAP[id].label)+'</span>'}).join("")+m.taOnly.map(function(t){return '<span class="chip ta">Same area: '+esc(t)+'</span>'}).join("");
  c+=m.settingFit?'<span class="chip sig">Fits the setting</span>':'<span class="chip ta">Different setting</span>';
  var n=(inv.endorsements||[]).length;if(n)c+='<span class="chip sig">'+n+' doctor endorsement'+(n>1?'s':'')+'</span>';
  return c;
}
function partBars(m){var P=[["Condition fit",m.parts.concept,45],["Text similarity",m.parts.text,25],["Setting",m.parts.setting,15],["Evidence stage",m.parts.ready,10],["Endorsements",m.parts.endorse,5]];
  return '<div class="bars">'+P.map(function(p){return '<div class="bar"><div class="t"><span>'+p[0]+'</span><span>'+Math.round(p[1]*p[2])+'/'+p[2]+'</span></div><div class="tr"><div class="fl" style="width:'+(p[1]*100)+'%"></div></div></div>'}).join("")+'</div>'}
function champMini(list,authorName){
  if(!list.length)return '<p class="sub">No matching doctors yet. Import profiles on the Champions tab or ask patients to nominate.</p>';
  return '<div class="mini">'+list.map(function(x){var mine=authorName&&nameKey(authorName)===nameKey(x.d.name);
    return '<div class="m"><b>'+esc(x.d.name)+'</b> · '+x.c.total+'<br><span class="meta">'+esc(x.d.specialty||"")+(x.d.city?', '+esc(x.d.city):'')+(x.c.dual?' · clinic + hospital':'')+(x.c.noms.length?' · '+x.c.noms.length+' patient nomination'+(x.c.noms.length>1?'s':''):'')+'</span>'+(mine?'<br><span class="chip sig">Asked this question</span>':'')+(x.end?'<br><span class="chip sig">Endorsed this paper</span>':'')+(x.hit.length?'<br><span class="meta">Interest match: '+x.hit.map(function(h){return esc(CMAP[h].label)}).join(", ")+'</span>':'')+'</div>'}).join("")+'</div>';
}
function viewMatch(){
  var idf=idfTable(),main="",side="";
  var seg='<div class="seg" role="group" aria-label="Start from"><button data-act="mode" data-v="question" aria-pressed="'+(ui.mode==="question")+'">Start from a question</button><button data-act="mode" data-v="invention" aria-pressed="'+(ui.mode==="invention")+'">Start from a paper</button></div>';
  if(ui.mode==="question"){
    var q=state.questions.filter(function(x){return x.id===ui.selQ})[0]||state.questions[0];
    if(!q){main='<div class="empty">Post a question first.</div>'}else{
      var qc=concepts(qText(q));
      var res=state.inventions.map(function(i){return {i:i,m:matchPair(q,i,idf)}}).sort(function(a,b){return b.m.score-a.m.score});
      main='<div class="toolbar">'+seg+'<label class="f" for="sel-q" style="flex:1;min-width:240px">Question<select id="sel-q">'+state.questions.map(function(x){return '<option value="'+x.id+'"'+(x.id===q.id?' selected':'')+'>'+esc(x.question.slice(0,90))+(x.question.length>90?'…':'')+'</option>'}).join("")+'</select></label></div>'+
       '<div class="sel-summary"><b>Research bridge:</b> this question maps to <span class="chips" style="display:inline-flex;vertical-align:middle">'+chipsFor(qc)+'</span></div>'+
       '<div class="list">'+res.map(function(r,ix){return '<article class="card'+(ix<3&&r.m.score>=45?' hit':'')+'"><div><h3>'+esc(r.i.title)+'</h3><div class="meta">'+esc(r.i.kind)+' · '+esc(r.i.stage)+' · '+esc((r.i.settings||[]).join(", "))+(r.i.role?' · from '+esc(r.i.role.toLowerCase()):'')+'</div></div><div class="score">'+r.m.score+'<small>match</small></div><div class="body"><p>'+esc(r.i.summary)+(r.i.source?' <a href="'+esc(r.i.source)+'" rel="noopener">Source</a>':'')+'</p></div><div class="chips">'+reasonChips(r.m,r.i)+(r.i.sample?'<span class="chip sample">Sample</span>':'')+'</div>'+partBars(r.m)+'</article>'}).join("")+'</div>';
      side='<div class="panel"><h2>Likely champions</h2><p class="sub">Doctors in the relevant specialties, clinic + hospital first.</p>'+champMini(relevantChampions(qc,4),q.author)+'</div>';
    }
  }else{
    var inv=state.inventions.filter(function(x){return x.id===ui.selI})[0]||state.inventions[0];
    if(!inv){main='<div class="empty">Submit a paper first.</div>'}else{
      var ic=iConcepts(inv);
      var rq=state.questions.map(function(q){return {q:q,m:matchPair(q,inv,idf)}}).sort(function(a,b){return b.m.score-a.m.score});
      main='<div class="toolbar">'+seg+'<label class="f" for="sel-i" style="flex:1;min-width:240px">Paper or invention<select id="sel-i">'+state.inventions.map(function(x){return '<option value="'+x.id+'"'+(x.id===inv.id?' selected':'')+'>'+esc(x.title)+'</option>'}).join("")+'</select></label></div>'+
       '<div class="sel-summary"><b>Research bridge:</b> this paper maps to <span class="chips" style="display:inline-flex;vertical-align:middle">'+chipsFor(ic)+'</span></div>'+
       '<div class="list">'+rq.map(function(r,ix){return '<article class="card'+(ix<2&&r.m.score>=45?' hit':'')+'"><div><h3>'+esc(r.q.question)+'</h3><div class="meta">'+esc(r.q.author)+' · '+esc(r.q.specialty)+' · '+esc(r.q.setting)+' · '+(r.q.votes||0)+' see this too</div></div><div class="score">'+r.m.score+'<small>match</small></div><div class="chips">'+reasonChips(r.m,inv)+'</div>'+partBars(r.m)+'</article>'}).join("")+'</div>';
      side='<div class="panel"><h2>Likely champions</h2><p class="sub">Doctors who endorsed this paper come first, then those whose specialty or interests fit.</p>'+champMini(relevantChampions(ic,4,inv),"")+'</div>';
    }
  }
  return '<div class="split"><div>'+main+'</div><div>'+side+'<p class="legend">Match = 45% condition fit from the research bridge (text plus annotations), 25% text similarity, 15% setting fit, 10% evidence stage, 5% doctor endorsements.</p></div></div>';
}

function render(){
  var note=shared==="on"?(readOnly?'<b>View only.</b> You can browse but not post on this copy.':'<b>Shared exchange.</b> Questions, papers, endorsements and nominations are saved for everyone who opens this page.'):shared==="checking"?'Connecting…':'<b>Preview mode.</b> Changes stay in this view until the page is opened from its claude.ai link.';
  var view={champions:viewChampions,match:viewMatch,papers:viewPapers,nominate:viewNominate}[ui.tab]||viewQuestions;
  document.getElementById("root").innerHTML='<header class="top"><div class="wrap"><div class="brand"><h1>Clinician Research Exchange</h1><p>Clinicians post the patterns they want to study, researchers and inventors add papers, and patients nominate doctors they trust. Matching connects all three.</p></div><nav class="tabs" aria-label="Sections">'+TABS.map(function(t){return '<a href="#'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</a>'}).join("")+'</nav></div></header>'+
   '<main><div class="wrap"><div class="notice" role="status">'+note+' Entries marked Sample are illustrative, not real people or products.</div>'+view()+'</div></main>';
}

/* ---------- Events ---------- */
var root=document.getElementById("root");
function val(id){var el=document.getElementById(id);return el?el.value.trim():""}
function checked(prefix,list){return list.filter(function(s,ix){var c=document.getElementById(prefix+ix);return c&&c.checked})}
function keepForm(ids){var v={};ids.forEach(function(id){var el=document.getElementById(id);if(el)v[id]=el.type==="checkbox"?el.checked:el.value});return function(){for(var id in v){var el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=v[id];else el.value=v[id]}}}}
function formIds(id){var f=document.getElementById(id);return f?Array.prototype.map.call(f.querySelectorAll("input,select,textarea"),function(e){return e.id}).filter(Boolean):[]}

root.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act"),id=b.getAttribute("data-id");
  if(a==="vote"){var q=state.questions.filter(function(x){return x.id===id})[0];if(q){q.votes=(q.votes||0)+1;save()}}
  else if(a==="findinv"){ui.selQ=id;ui.mode="question";location.hash="match";ui.tab="match";render();window.scrollTo(0,0)}
  else if(a==="seematch"){ui.selI=id;ui.mode="invention";location.hash="match";ui.tab="match";render();window.scrollTo(0,0)}
  else if(a==="mode"){ui.mode=b.getAttribute("data-v");render()}
  else if(a==="prole"){var restore=keepForm(formIds("p-form"));ui.pRole=b.getAttribute("data-v");ui.pErr="";render();restore()}
  else if(a==="endorse"){var inv=state.inventions.filter(function(x){return x.id===id})[0],did=val("e-"+id);
    if(!did){ui.eMsg[id]="Choose who is endorsing first.";render();return}
    inv.endorsements=inv.endorsements||[];
    if(inv.endorsements.indexOf(did)>=0){ui.eMsg[id]="Already endorsed by this doctor.";render();return}
    inv.endorsements.push(did);ui.eMsg[id]="Endorsement added.";save()}
  else if(a==="importcsv"){importCsv(document.getElementById("csv-in").value)}
});
root.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="f-city"){ui.city=t.value;render()}
  else if(t.id==="f-spec"){ui.spec=t.value;render()}
  else if(t.id==="f-dual"){ui.dualOnly=t.checked;render()}
  else if(t.id==="sel-q"){ui.selQ=t.value;render()}
  else if(t.id==="sel-i"){ui.selI=t.value;render()}
  else if(t.id==="n-doc"){var nd=document.getElementById("n-newdoc");if(nd)nd.style.display=t.value==="__new"?"flex":"none"}
});
root.addEventListener("input",function(e){
  if(e.target.id==="p-summary"||e.target.id==="p-title"||e.target.id==="p-claim"){var p=document.getElementById("p-preview");if(p){var found=concepts(val("p-title")+" "+val("p-summary")+" "+val("p-claim"));p.innerHTML=chipsFor(found);
    CONCEPTS.forEach(function(c,ix){var cb=document.getElementById("p-c-"+ix);if(cb&&found.indexOf(c.id)>=0&&!cb.dataset.touched)cb.checked=true})}}
  if(/^p-c-\d+$/.test(e.target.id))e.target.dataset.touched="1";
});
root.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="q-form"){
    var restoreQ=keepForm(formIds("q-form"));
    var author=val("q-author"),question=val("q-question"),pop=val("q-pop");
    if(!author||!question){ui.qErr="Add your name and your question before posting.";render();restoreQ();return}
    var probs=phiProblems(question+" "+pop);
    if(probs.length){ui.qErr="Remove patient identifiers before posting. Found: "+probs.join(", ")+".";render();restoreQ();return}
    ui.qErr="";
    state.questions.unshift({id:uid("q"),author:author,specialty:val("q-spec"),city:val("q-city"),setting:val("q-setting"),volume:+val("q-vol")||0,question:question,population:pop,tags:val("q-tags").split(",").map(function(s){return s.trim()}).filter(Boolean),votes:0,created:new Date().toISOString().slice(0,10)});
    save();
  }else if(f.id==="p-form"){
    var restoreP=keepForm(formIds("p-form"));
    var name=val("p-name"),title=val("p-title"),summary=val("p-summary"),src=val("p-source");
    var tagIds=CONCEPTS.filter(function(c,ix){var cb=document.getElementById("p-c-"+ix);return cb&&cb.checked}).map(function(c){return c.id});
    var sets=checked("p-s-",SETTINGS),needs=checked("p-n-",NEEDS);
    var err=!name||!title||!summary?"Add your name, a title and the abstract or summary.":
      (src&&!/^https?:\/\//.test(src))?"The source link must start with http:// or https://.":
      !tagIds.length&&!concepts(title+" "+summary).length?"Tick at least one condition it targets, so it can be matched.":
      !sets.length?"Pick at least one setting where it works.":
      !document.getElementById("p-rights").checked?"Confirm you wrote this summary or have permission to share it.":"";
    var ph=phiProblems([summary,val("p-claim"),val("p-pop"),val("p-limits")].join(" "));
    if(!err&&ph.length)err="Remove patient identifiers first. Found: "+ph.join(", ")+".";
    if(err){ui.pErr=err;ui.pMsg="";render();restoreP();return}
    var inv={id:uid("i"),title:title,kind:val("p-kind"),stage:val("p-stage"),settings:sets,summary:summary,source:src,role:ui.pRole,submitter:name,tagIds:tagIds,
      annot:{claim:val("p-claim"),population:val("p-pop"),needs:needs,limits:val("p-limits")},endorsements:[],created:new Date().toISOString().slice(0,10)};
    var me=ui.pRole==="Doctor"?docByName(name):null;if(me)inv.endorsements.push(me.id);
    state.inventions.unshift(inv);ui.pErr="";
    ui.pMsg="Added. "+(me?"It counts as your endorsement. ":ui.pRole==="Doctor"?"Your name did not match a doctor profile, so no endorsement was linked. ":"")+"Use See matches on its card to find questions and doctors.";
    save();window.scrollTo(0,0);
  }else if(f.id==="n-form"){
    var restoreN=keepForm(formIds("n-form"));
    var did=val("n-doc"),reasons=checked("n-r-",TRUST),note=val("n-note");
    var nerr=!did?"Choose your doctor, or pick 'My doctor is not on this list'.":
      (did==="__new"&&!val("n-name"))?"Add your doctor's name.":
      !reasons.length?"Pick at least one reason you trust them.":
      !document.getElementById("n-consent").checked?"Tick the box to confirm you understand who can see this.":"";
    var nph=phiProblems(note+" "+val("n-clinic"));
    if(!nerr&&nph.length)nerr="Please remove personal details from your note. Found: "+nph.join(", ")+".";
    if(nerr){ui.nErr=nerr;ui.nMsg="";render();restoreN();var nd=document.getElementById("n-newdoc");if(nd&&did==="__new")nd.style.display="flex";return}
    var docId=did;
    if(did==="__new"){var ex=docByName(val("n-name"));
      if(ex)docId=ex.id;else{var nd2={id:uid("d"),name:/^dr/i.test(val("n-name"))?val("n-name"):"Dr. "+val("n-name"),specialty:val("n-spec"),city:val("n-city"),years:0,clinic:val("n-clinic"),hospitals:[],pubs:0,trials:0,teaching:false,reviews:0,interests:"",url:"",nominated:true,verified:false};state.doctors.push(nd2);docId=nd2.id}}
    state.nominations.push({id:uid("n"),doctorId:docId,by:val("n-by"),reasons:reasons,area:val("n-area"),since:val("n-since"),note:note,created:new Date().toISOString().slice(0,10)});
    ui.nErr="";ui.nMsg="Thank you. Your nomination for "+docById(docId).name+" has been added.";
    save();
  }
});

function parseCsvLine(line){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===","){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out.map(function(s){return s.trim()})}
function importCsv(text){
  var lines=String(text||"").split(/\r?\n/).filter(function(l){return l.trim()});
  if(lines.length<2){ui.csvMsg="Paste a header row and at least one doctor.";render();return}
  var h=parseCsvLine(lines[0]).map(function(s){return s.toLowerCase()});
  if(h.indexOf("name")<0||h.indexOf("specialty")<0){ui.csvMsg="The header needs at least name and specialty columns.";render();return}
  var n=0,merged=0;lines.slice(1).forEach(function(l){var c=parseCsvLine(l),r={};h.forEach(function(k,i){r[k]=c[i]||""});if(!r.name)return;
    var rec={name:r.name,specialty:r.specialty,city:r.city,years:+r.years||0,clinic:r.clinic,hospitals:(r.hospitals||"").split(";").map(function(s){return s.trim()}).filter(Boolean),pubs:+r.publications||0,trials:+r.trials||0,teaching:/^(y|yes|true|1)$/i.test(r.teaching||""),reviews:+r.reviews||0,interests:r.interests,url:/^https?:\/\//.test(r.profile_url||"")?r.profile_url:""};
    var ex=docByName(r.name);
    if(ex&&ex.nominated&&!ex.verified){for(var k in rec)ex[k]=rec[k];ex.verified=true;merged++}
    else{rec.id=uid("d");state.doctors.push(rec);n++}});
  ui.csvMsg="Imported "+n+" doctor"+(n===1?"":"s")+(merged?", and completed "+merged+" patient-nominated profile"+(merged>1?"s":""):"")+".";save();
}
render();
})();
</script>
